<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- For GitHub Pages at username.github.io/MathHelp/ use: <base href="/MathHelp/" /> -->
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="app_icon.png" />
    <title>Mattehjälpen</title>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>
    <script src="js/pdf.js"></script>
    <script src="js/culture.js"></script>
    <script>
        (function () {
            var stored = window.MathHelpCulture && window.MathHelpCulture.get ? window.MathHelpCulture.get() : '';
            if (stored === 'sv' || stored === 'en') {
                var qs = new URLSearchParams(window.location.search);
                if (qs.get('culture') !== stored) {
                    qs.set('culture', stored);
                    var url = window.location.pathname + '?' + qs.toString() + window.location.hash;
                    window.location.replace(url);
                }
            }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
