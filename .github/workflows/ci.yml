name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore MathHelp.slnx --locked-mode

      - name: Build
        run: dotnet build MathHelp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MathHelp.slnx -c Release --no-build
